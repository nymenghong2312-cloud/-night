<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image</title>

    <style>
        body {
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column; /* stack */
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            text-align: center;
            gap: 20px;
        }

        .container img {
            max-width: 90%;
            height: auto;
        }

        h1 {
            font-size: clamp(20px, 5vw, 40px); /* responsive text */
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="image.gif" alt="Description">
        <h1>B jol dek hz</h1>
    </div>

</body>
</html>
